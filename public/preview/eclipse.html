<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HeyMoon.AI</title>
<meta name="description" content="Paste your store link. HeyMoon builds a complete creator campaign around what you sell, and guarantees the sales.">
<style>
:root{
  --night:#010317;--ground:#000211;--deep:#141229;--purple:#4D2FB0;--violet:#7C5CE0;--lilac:#9B7BF0;--glow:#A65FED;--pink:#F0559D;--paper:#FCFBF8;--ink:#12151B;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:"Geist","Geist Sans",system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:#F5F3FB;font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ---------- header ---------- */
header{position:absolute;inset:0 0 auto 0;z-index:6}
.bar{max-width:1280px;margin:0 auto;height:76px;padding:0 48px;display:flex;align-items:center;justify-content:space-between}
.wm{font-weight:600;font-size:19px;letter-spacing:-.03em;line-height:1;color:#fff;user-select:none}
.wm span{color:var(--violet)}
.dash{height:40px;padding:0 18px;border-radius:100px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:14px;font-weight:500;letter-spacing:-.01em;color:#fff;transition:background .2s}
.dash:hover{background:rgba(255,255,255,.12)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:max(660px,calc(100svh - 40px));overflow:hidden;isolation:isolate;
  background:radial-gradient(70% 90% at 72% 46%,#0b0a2a 0%,#050420 38%,var(--night) 62%,var(--ground) 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s var(--ease);z-index:0}
#gl.on{opacity:1}
.grid{position:relative;z-index:2;max-width:1280px;margin:0 auto;min-height:inherit;padding:92px 48px 64px;
  display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:center;column-gap:16px}
.copy{position:relative;max-width:610px}

/* switch */
.switch{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;width:268px;height:48px;padding:4px;border-radius:100px;
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.11),0 10px 30px -12px rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.switch .thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:40px;border-radius:100px;background:#fff;
  box-shadow:0 1px 2px rgba(18,21,27,.1),0 10px 24px -8px rgba(124,92,224,.55);transition:transform .52s var(--ease),width .52s var(--ease)}
.switch[data-a=creators] .thumb{transform:translateX(100%)}
.switch button{position:relative;z-index:1;border-radius:100px;font-size:15px;font-weight:500;letter-spacing:-.01em;color:rgba(255,255,255,.62);transition:color .4s var(--ease)}
.switch button[aria-selected=true]{color:var(--ink)}
.switch button:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

h1{margin-top:30px;font-weight:600;font-size:clamp(40px,4.75vw,74px);line-height:1.01;letter-spacing:-.047em;color:#F7F5FC}
h1 .ln{display:block;text-wrap:balance;will-change:transform,filter,opacity}
h1 .l2{background:linear-gradient(95deg,#A88BFF 0%,#B57BF4 38%,#F0559D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}

/* field */
.fieldwrap{position:relative;margin-top:38px;max-width:548px}
.fieldwrap::before{content:"";position:absolute;inset:-18px -24px;border-radius:40px;z-index:-1;opacity:.5;
  background:radial-gradient(40% 60% at 35% 55%,rgba(124,92,224,.55),transparent 70%),radial-gradient(38% 58% at 68% 45%,rgba(240,85,157,.38),transparent 70%);
  filter:blur(40px);transition:opacity .6s var(--ease)}
.fieldwrap.focus::before{opacity:.95}
.field{display:flex;align-items:center;height:68px;padding:0 9px 0 20px;border-radius:22px;background:var(--paper);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 2px 4px rgba(0,0,0,.25),0 30px 60px -28px rgba(124,92,224,.7);transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.fieldwrap.focus .field{box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 0 0 4px rgba(155,123,240,.35),0 30px 70px -26px rgba(124,92,224,.9)}
.ico{position:relative;width:20px;height:20px;flex:none;color:rgba(18,21,27,.45)}
.ico svg{position:absolute;inset:0;width:20px;height:20px;transition:opacity .35s var(--ease),transform .5s var(--ease)}
.ico .at{opacity:0;transform:scale(.6) rotate(-40deg)}
[data-aud=creators] .ico .globe{opacity:0;transform:scale(.6) rotate(40deg)}
[data-aud=creators] .ico .at{opacity:1;transform:none}
.field input{flex:1;min-width:0;height:100%;padding:0 12px;border:0;outline:0;background:transparent;font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.field input::placeholder{color:rgba(18,21,27,.42)}
.go{height:50px;padding:0 24px;border-radius:13px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em;transition:transform .2s var(--ease),background .2s}
.go:hover{background:#000}
.go:active{transform:scale(.97)}
.go:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;list-style:none;font-size:14px;letter-spacing:-.005em;color:rgba(235,232,250,.62)}
.chips li{display:flex;align-items:center;gap:7px}
.chips svg{width:14px;height:14px;color:var(--lilac);flex:none}

/* stage holds the sculpture's measured box + the static render */
.stage{position:relative;width:min(112%,78svh,700px);aspect-ratio:1;justify-self:center;margin-right:-6%}
.still{position:absolute;inset:-14%;width:128%;height:128%;transition:opacity .5s var(--ease) .15s}
.still.off{opacity:0}
.still .cc{opacity:0;transition:opacity .9s var(--ease)}
[data-aud=creators] .still .cc{opacity:1}
[data-aud=creators] .still .cb{opacity:0}
.still .cb{transition:opacity .9s var(--ease)}
.still .bead{transform-origin:0 0;transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
[data-aud=creators] .still .bead{transform:rotate(180deg)}

.sheet{position:relative;z-index:3;height:44px;margin:-44px 24px 0;border-radius:32px 32px 0 0;background:var(--paper)}

@media (max-width:860px){
  .bar{height:64px;padding:0 16px}
  .wm{font-size:18px}
  .dash{height:38px;padding:0 16px}
  .grid{grid-template-columns:1fr;padding:66px 16px 56px;justify-items:center;text-align:center;align-content:center}
  .stage{order:-1;width:min(94vw,52svh,520px);margin:-6px 0 -28px}
  .copy{display:flex;flex-direction:column;align-items:center}
  .switch{width:100%;max-width:300px}
  h1{margin-top:22px;font-size:clamp(34px,9.8vw,46px)}
  .fieldwrap{width:100%;margin-top:28px}
  .field{height:62px;border-radius:20px;padding-left:18px}
  .field input{font-size:17px}
  .go{height:46px;padding:0 20px}
  .chips{justify-content:center;gap:6px 16px;font-size:13px}
  .sheet{margin:-36px 12px 0;height:36px;border-radius:24px 24px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
.rm .still .bead,.rm .switch .thumb{transition:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app" data-aud="brands">
<header><div class="bar">
  <div class="wm" aria-label="HeyMoon.AI">HeyMoon<span>.AI</span></div>
  <button class="dash" type="button">Dashboard</button>
</div></header>

<section class="hero" id="hero">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="grid">
    <div class="copy">
      <div class="switch" id="sw" role="tablist" aria-label="Who HeyMoon is for" data-a="brands">
        <span class="thumb" aria-hidden="true"></span>
        <button role="tab" id="tb" aria-selected="true" data-a="brands">Brands</button>
        <button role="tab" id="tc" aria-selected="false" data-a="creators">Creators</button>
      </div>
      <h1 id="h1"><span class="ln l1">A campaign in fifteen seconds.</span><span class="ln l2">Sales, guaranteed.</span></h1>
      <div class="fieldwrap" id="fw">
        <form class="field" id="f" action="/brands/c" autocomplete="off">
          <span class="ico" aria-hidden="true">
            <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z"/></svg>
            <svg class="at" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.8"/><path d="M15.8 12v1.6a2.7 2.7 0 0 0 5.4 0V12a9.2 9.2 0 1 0-3.6 7.3"/></svg>
          </span>
          <label class="sr" for="q" id="ql">Your store link</label>
          <input id="q" name="read" placeholder="yourstore.com" spellcheck="false" autocapitalize="off" inputmode="url">
          <button class="go" id="go" type="submit">Start</button>
        </form>
      </div>
      <ul class="chips" id="chips">
        <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.4 2.8 2.8 6.2-6.4"/></svg><span>No forms to fill in</span></li>
        <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.4 2.8 2.8 6.2-6.4"/></svg><span>No brief to write</span></li>
        <li><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.4 2.8 2.8 6.2-6.4"/></svg><span>No agency to manage</span></li>
      </ul>
    </div>

    <div class="stage" id="stage" aria-hidden="true">
      <!-- static render: shown first, kept for reduced motion and no-WebGL -->
      <svg class="still" id="still" viewBox="-192 -192 384 384">
        <defs>
          <radialGradient id="corB" cx="0" cy="0" r="192" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#050419"/><stop offset=".511" stop-color="#0a0920"/>
            <stop offset=".517" stop-color="#fff"/><stop offset=".524" stop-color="#ddd3ff"/>
            <stop offset=".55" stop-color="#a68af5" stop-opacity=".55"/><stop offset=".62" stop-color="#7c5ce0" stop-opacity=".26"/>
            <stop offset=".78" stop-color="#4d2fb0" stop-opacity=".1"/><stop offset="1" stop-color="#4d2fb0" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="corC" cx="0" cy="0" r="192" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#070419"/><stop offset=".511" stop-color="#0e0920"/>
            <stop offset=".517" stop-color="#fff"/><stop offset=".524" stop-color="#ffd9ec"/>
            <stop offset=".55" stop-color="#e88bc4" stop-opacity=".5"/><stop offset=".62" stop-color="#a65fed" stop-opacity=".26"/>
            <stop offset=".78" stop-color="#4d2fb0" stop-opacity=".1"/><stop offset="1" stop-color="#4d2fb0" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="flare"><stop offset="0" stop-color="#fff"/><stop offset=".1" stop-color="#f1ebff" stop-opacity=".9"/><stop offset=".35" stop-color="#b9a2ff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5ce0" stop-opacity="0"/></radialGradient>
          <radialGradient id="flareC"><stop offset="0" stop-color="#fff"/><stop offset=".1" stop-color="#ffe9f4" stop-opacity=".9"/><stop offset=".35" stop-color="#f590c4" stop-opacity=".35"/><stop offset="1" stop-color="#f0559d" stop-opacity="0"/></radialGradient>
          <linearGradient id="spk" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="bodyB" x1="120" y1="-120" x2="-110" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d8ccff" stop-opacity=".95"/><stop offset=".45" stop-color="#7f66dc" stop-opacity=".75"/><stop offset="1" stop-color="#3a2a90" stop-opacity=".7"/></linearGradient>
          <linearGradient id="bodyC" x1="-110" y1="110" x2="120" y2="-120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd0e6" stop-opacity=".95"/><stop offset=".45" stop-color="#c46aa6" stop-opacity=".72"/><stop offset="1" stop-color="#4d2a80" stop-opacity=".7"/></linearGradient>
          <linearGradient id="winB" x1="70" y1="-70" x2="-70" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a3a9a" stop-opacity=".7"/><stop offset="1" stop-color="#120d34" stop-opacity=".8"/></linearGradient>
          <linearGradient id="winC" x1="-70" y1="70" x2="70" y2="-70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7a3f80" stop-opacity=".7"/><stop offset="1" stop-color="#1c0f34" stop-opacity=".8"/></linearGradient>
          <linearGradient id="hiL" x1="0" y1="-110" x2="-110" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0559d"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#7c5ce0"/></linearGradient>
          <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".12" stop-color="#e6dcff" stop-opacity=".9"/><stop offset=".45" stop-color="#9b7bf0" stop-opacity=".3"/><stop offset="1" stop-color="#7c5ce0" stop-opacity="0"/></radialGradient>
          <clipPath id="starClip"><path d="M0-134A195.1 195.1 0 0 0 134 0A195.1 195.1 0 0 0 0 134A195.1 195.1 0 0 0-134 0A195.1 195.1 0 0 0 0-134Z"/></clipPath>
          <clipPath id="winClip"><path d="M0-69.1A221.9 221.9 0 0 0 69.1 0A221.9 221.9 0 0 0 0 69.1A221.9 221.9 0 0 0-69.1 0A221.9 221.9 0 0 0 0-69.1Z"/></clipPath>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
          <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
          <filter id="blur8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
        </defs>
        <circle class="cb" r="192" fill="url(#corB)"/>
        <circle class="cc" r="192" fill="url(#corC)"/>
        <circle r="99.3" fill="none" stroke="#fff" stroke-width="1.1" opacity=".85"/>
        <g class="bead">
          <g transform="translate(69.2 -71.2)">
            <circle class="cb" r="70" fill="url(#flare)" opacity=".55" filter="url(#blur8)"/>
            <circle class="cc" r="70" fill="url(#flareC)" opacity=".55" filter="url(#blur8)"/>
            <rect x="-70" y="-.55" width="140" height="1.1" fill="url(#spk)" opacity=".8"/>
            <rect x="-70" y="-.55" width="140" height="1.1" fill="url(#spk)" opacity=".8" transform="rotate(90)"/>
            <circle r="16" fill="url(#flare)"/><circle r="3.4" fill="#fff"/>
          </g>
          <g fill="#ece6ff" opacity=".5"><circle r="1.6" cx="98.8" cy="9.7"/><circle r="1.6" cx="54.1" cy="83.3"/><circle r="1.6" cx="-31.4" cy="94.2"/><circle r="1.6" cx="-93.2" cy="34.2"/><circle r="1.6" cx="-84.8" cy="-51.6"/><circle r="1.6" cx="-12.6" cy="-98.5"/></g>
        </g>
        <g>
          <path d="M0-134A195.1 195.1 0 0 0 134 0A195.1 195.1 0 0 0 0 134A195.1 195.1 0 0 0-134 0A195.1 195.1 0 0 0 0-134Z" fill="#2a2068" fill-opacity=".55"/>
          <g clip-path="url(#starClip)">
            <path class="cb" d="M0-134A195.1 195.1 0 0 0 134 0A195.1 195.1 0 0 0 0 134A195.1 195.1 0 0 0-134 0A195.1 195.1 0 0 0 0-134Z" fill="none" stroke="url(#bodyB)" stroke-width="30" stroke-opacity=".8" filter="url(#blur4)"/>
            <path class="cc" d="M0-134A195.1 195.1 0 0 0 134 0A195.1 195.1 0 0 0 0 134A195.1 195.1 0 0 0-134 0A195.1 195.1 0 0 0 0-134Z" fill="none" stroke="url(#bodyC)" stroke-width="30" stroke-opacity=".8" filter="url(#blur4)"/>
            <rect x="-220" y="-14" width="440" height="28" fill="#fff" opacity=".055" transform="rotate(-37) translate(0 -26)" filter="url(#soft)"/>
            <rect x="-220" y="-1.2" width="440" height="2.4" fill="#fff" opacity=".07" transform="rotate(-37) translate(0 -2)"/>
          </g>
          <path d="M0-126A198 198 0 0 1-126 0" fill="none" stroke="url(#hiL)" stroke-width="1.8" filter="url(#soft)"/>
          <path d="M0-122A199 199 0 0 0 122 0" fill="none" stroke="#efe9ff" stroke-opacity=".5" stroke-width="2.2" filter="url(#soft)"/>
          <path d="M0 124A198.5 198.5 0 0 0-124 0" fill="none" stroke="url(#prism)" stroke-opacity=".45" stroke-width="1.3" filter="url(#soft)"/>
          <path d="M0-134A195.1 195.1 0 0 0 134 0A195.1 195.1 0 0 0 0 134A195.1 195.1 0 0 0-134 0A195.1 195.1 0 0 0 0-134Z" fill="none" stroke="#f6f2ff" stroke-opacity=".55" stroke-width=".9"/>
          <circle r="34" fill="url(#core)"/>
          <rect x="-46" y="-.5" width="92" height="1" fill="url(#spk)" opacity=".9"/>
          <rect x="-46" y="-.5" width="92" height="1" fill="url(#spk)" opacity=".9" transform="rotate(90)"/>
        </g>
      </svg>
    </div>
  </div>
</section>
<div class="sheet" aria-hidden="true"></div>
</div>

<script>
(() => {
"use strict";
const qs = new URLSearchParams(location.search);
const app = document.getElementById("app");
const RM = qs.get("rm") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
if (RM) app.classList.add("rm");

const COPY = {
  brands:   { l1: "A campaign in fifteen seconds.", l2: "Sales, guaranteed.", ph: "yourstore.com", label: "Your store link", action: "/brands/c", mode: "url",
              chips: ["No forms to fill in", "No brief to write", "No agency to manage"] },
  creators: { l1: "Your posts already sell.", l2: "Take a cut of it.", ph: "yourhandle", label: "Your Instagram or TikTok handle", action: "/creators/c", mode: "text",
              chips: ["No sign-up to start", "No agency in the middle", "Paid on time"] }
};
const $ = (id) => document.getElementById(id);
const sw = $("sw"), l1 = document.querySelector(".l1"), l2 = document.querySelector(".l2"), q = $("q"), f = $("f"), fw = $("fw"), chips = $("chips"), go = $("go");
let aud = qs.get("a") === "creators" ? "creators" : "brands";

/* ---- copy ---- */
function setCopy(a) {
  const c = COPY[a];
  l1.textContent = c.l1; l2.textContent = c.l2;
  q.placeholder = c.ph; q.setAttribute("inputmode", c.mode); $("ql").textContent = c.label; f.action = c.action;
  chips.querySelectorAll("span").forEach((s, i) => (s.textContent = c.chips[i]));
}
function setTabs(a) {
  app.dataset.aud = a; sw.dataset.a = a;
  $("tb").setAttribute("aria-selected", a === "brands"); $("tc").setAttribute("aria-selected", a === "creators");
}
const OUT = { duration: 260, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" };
const IN = { duration: 760, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" };
function swapCopy(a) {
  if (RM) {
    [l1, l2, q, chips].forEach((el) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }));
    setCopy(a); return;
  }
  const els = [l1, l2, chips];
  els.forEach((el, i) => el.animate([{ opacity: 1, filter: "blur(0px)", transform: "none" },
    { opacity: 0, filter: "blur(12px)", transform: "translateY(-.14em) scale(.985)" }], { ...OUT, delay: i * 55 }));
  q.animate([{ opacity: 1 }, { opacity: 0 }], { ...OUT, delay: 60 });
  setTimeout(() => {
    setCopy(a);
    els.forEach((el, i) => el.animate([{ opacity: 0, filter: "blur(14px)", transform: "translateY(.22em)" },
      { opacity: 1, filter: "blur(0px)", transform: "none" }], { ...IN, delay: 120 + i * 85 }));
    q.animate([{ opacity: 0 }, { opacity: 1 }], { ...IN, delay: 260 });
  }, 380);
}
function switchTo(a) {
  if (a === aud) return;
  aud = a; setTabs(a); swapCopy(a); viz.audience(a === "creators" ? 1 : 0, true);
}
sw.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) switchTo(b.dataset.a); });
sw.addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { switchTo(aud === "brands" ? "creators" : "brands"); (aud === "brands" ? $("tb") : $("tc")).focus(); } });
window.__switch = () => switchTo(aud === "brands" ? "creators" : "brands");

/* ---- field ---- */
q.addEventListener("focus", () => { fw.classList.add("focus"); viz.focus(1); });
q.addEventListener("blur", () => { fw.classList.remove("focus"); viz.focus(0); });
q.addEventListener("input", () => viz.type(q.value.length));
f.addEventListener("submit", (e) => {
  e.preventDefault(); /* prototype: the real field navigates to /brands/c or /creators/c */
  viz.launch(); go.textContent = "Reading";
  setTimeout(() => (go.textContent = "Start"), 2600);
});

/* ---- visual ---- */
const still = $("still");
const viz = { audience() {}, focus() {}, type() {}, launch() {} };
setTabs(aud); setCopy(aud);
